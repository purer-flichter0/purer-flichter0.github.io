<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>BUTTCHECKS // REWARD</title>

<style>

body {
margin: 0;
font-family: "Courier New", monospace;
background: url("background.jpg") no-repeat center center fixed;
background-size: cover;
color: #00ff9d;
overflow-x: hidden;
}

/* DARK OVERLAY */

.overlay {
position: fixed;
width: 100%;
height: 100%;
background: rgba(0,0,0,0.85);
z-index: 1;
}

/* MAIN */

#main {
position: relative;
z-index: 2;
padding: 30px;
}

/* HEADER */

.header {
border-bottom: 1px solid #00ff9d;
margin-bottom: 30px;
text-align: center;
padding-bottom: 20px;
}

.header h1 {
font-size: 52px;
margin-bottom: 10px;
letter-spacing: 4px;
}

.header p {
font-size: 18px;
color: #7fffd4;
}

/* BUTTON */

.backBtn {
width: 260px;
display: block;
margin: 0 auto 40px auto;
padding: 12px;
background: black;
color: #00ff9d;
border: 1px solid #00ff9d;
font-family: "Courier New", monospace;
font-size: 16px;
cursor: pointer;
transition: 0.2s;
}

.backBtn:hover {
background: #00ff9d;
color: black;
box-shadow: 0 0 15px #00ff9d;
}

/* REWARD IMAGE BOX */

.rewardBox {
max-width: 900px;
margin: 0 auto;
padding: 20px;
background: rgba(0,0,0,0.75);
border: 2px solid #00ff9d;
box-shadow: 0 0 25px #00ff9d;
text-align: center;
}

.rewardBox img {
width: 100%;
max-height: 75vh;
object-fit: contain;
border: 2px solid #00ff9d;
box-shadow: 0 0 20px #00ff9d;
}

/* OPTIONAL GLOW */

.rewardText {
margin-top: 20px;
font-size: 22px;
letter-spacing: 2px;
animation: pulse 1s infinite alternate;
}

@keyframes pulse {
from {
opacity: 0.7;
}
to {
opacity: 1;
}
}

</style>
</head>

<body>

<div class="overlay"></div>

<div id="main">

<div class="header">

<h1>🎁 REWARD UNLOCKED 🎁</h1>

<p>CLASSIFIED CHEEK CONTENT ACQUIRED</p>

</div>

<button class="backBtn" onclick="goBack()">
⬅ RETURN TO LOGIN
</button>

<div class="rewardBox">

<img src="reward.jpeg">

<div class="rewardText">
MAXIMUM THICCNESS ACHIEVED
</div>

</div>

</div>

<script>

function goBack() {

window.location.href = "index.html";

}

</script>

</body>
</html>
