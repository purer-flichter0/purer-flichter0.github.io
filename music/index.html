<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>MUSIC // COMING SOON</title>

<style>

body {
margin: 0;
font-family: "Courier New", monospace;
background: url("../images/background.jpg") no-repeat center center fixed;
background-size: cover;
color: #00ff9d;
overflow: hidden;
}

/* OVERLAY */

.overlay {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(0,0,0,0.85);
z-index: 1;
}

/* MAIN CONTAINER */

.container {
position: relative;
z-index: 2;

min-height: 100vh;

display: flex;
flex-direction: column;
justify-content: center;
align-items: center;

text-align: center;
padding: 20px;
box-sizing: border-box;
}

/* TITLE */

h1 {
font-size: 56px;
letter-spacing: 5px;
margin-bottom: 15px;
text-shadow: 0 0 15px #00ff9d;
}

/* TEXT */

p {
font-size: 20px;
color: #7fffd4;
margin: 8px 0;
max-width: 700px;
line-height: 1.6;
}

/* BUTTON */

button {
margin-top: 30px;
padding: 12px 28px;
background: black;
border: 1px solid #00ff9d;
color: #00ff9d;
cursor: pointer;
font-family: "Courier New", monospace;
font-size: 16px;
transition: 0.2s;
}

button:hover {
background: #00ff9d;
color: black;
box-shadow: 0 0 15px #00ff9d;
}

/* GLOW BOX */

.moduleBox {
background: rgba(0,0,0,0.75);
padding: 40px;
border: 2px solid #00ff9d;
box-shadow: 0 0 25px #00ff9d;
max-width: 800px;
width: 90%;
}

</style>
</head>

<body>

<div class="overlay"></div>

<div class="container">

<div class="moduleBox">

<h1>🎵 MUSIC</h1>

<p>COMING SOON...</p>

<p>
This classified audio division is currently under construction.
</p>

<p>
Future updates will include:
<br><br>
• Secret playlists<br>
• Agent radio streams<br>
• Experimental THICC frequencies<br>
• Emergency cake alert broadcasts
</p>

<button onclick="window.location.href='../index.html'">
⬅ RETURN HOME
</button>

</div>

</div>

</body>
</html>
