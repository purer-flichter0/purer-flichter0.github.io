<!DOCTYPE html>
<html>
<head>
<title>SMITH GALLERY</title>

<style>

body {
margin: 0;
font-family: "Courier New", monospace;
background: url("background.jpg") no-repeat center center fixed;
background-size: cover;
color: #00ff9d;
}

/* DARK OVERLAY */
.overlay {
position: fixed;
width: 100%;
height: 100%;
background: rgba(0,0,0,0.85);
z-index: 1;
}

/* MAIN CONTAINER */
.container {
position: relative;
z-index: 2;
padding: 30px;
text-align: center;
}

/* HEADER */
.header {
border-bottom: 1px solid #00ff9d;
margin-bottom: 30px;
text-align: center;
padding-bottom: 20px;
}

.header h1 {
font-size: 48px;
letter-spacing: 4px;
margin-bottom: 10px;
}

.header p {
font-size: 18px;
color: #7fffd4;
}

/* GRID */
.grid {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
gap: 20px;
margin-top: 20px;
}

/* IMAGE BOX */
.imgBox {
border: 1px solid #00ff9d;
background: rgba(0,0,0,0.7);
padding: 10px;
transition: 0.2s;
cursor: pointer;

display: flex;
align-items: center;
justify-content: center;
height: 220px;
overflow: hidden;
}

.imgBox:hover {
transform: scale(1.05);
box-shadow: 0 0 15px #00ff9d;
background: rgba(0,255,157,0.1);
}

/* FULL IMAGE FIT (NO CROPPING) */
.imgBox img {
max-width: 100%;
max-height: 100%;
width: auto;
height: auto;
object-fit: contain;
display: block;
}

/* BACK BUTTON */
.backBtn {
margin-top: 40px;
display: inline-block;
padding: 12px 25px;
border: 1px solid #00ff9d;
background: black;
color: #00ff9d;
cursor: pointer;
text-decoration: none;
}

.backBtn:hover {
background: #00ff9d;
color: black;
box-shadow: 0 0 15px #00ff9d;
}

</style>
</head>

<body>

<div class="overlay"></div>

<div class="container">

<!-- HEADER -->
<div class="header">
<h1>PROJECT: BUTTCHECKS</h1>
<p>CLASSIFIED IMAGE ARCHIVE</p>
</div>

<h2>📸 SMITH GALLERY</h2>

<div class="grid">

<div class="imgBox">
<img src="image1.jpeg">
</div>

<div class="imgBox">
<img src="image2.jpeg">
</div>

<div class="imgBox">
<img src="image3.jpeg">
</div>

<div class="imgBox">
<img src="image4.jpeg">
</div>

<div class="imgBox">
<img src="image5.jpg">
</div>

<div class="imgBox">
<img src="image6.jpeg">
</div>

<div class="imgBox">
<img src="image7.jpg">
</div>

</div>

<!-- BACK BUTTON -->
<a class="backBtn" href="index.html">
⬅ RETURN TO BASE
</a>

</div>

</body>
</html>
