<!DOCTYPE html>

<style>

body {
margin: 0;
font-family: "Courier New", monospace;
background: url("../images/background.jpg") no-repeat center center fixed;
background-size: cover;
color: #00ff9d;
overflow-x: hidden;
}

/* OVERLAY */

.overlay {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(0,0,0,0.85);
z-index: 1;
pointer-events: none;
}

/* MAIN */

.main {
position: relative;
z-index: 2;
padding: 40px 20px;
max-width: 1200px;
margin: auto;
}

/* HEADER */

.header {
text-align: center;
margin-bottom: 50px;
border-bottom: 1px solid #00ff9d;
padding-bottom: 25px;
}

.header h1 {
font-size: 56px;
letter-spacing: 6px;
margin-bottom: 10px;
text-shadow: 0 0 15px #00ff9d;
}

.header p {
font-size: 18px;
color: #7fffd4;
}

/* IMAGE GRID */

.imageGrid {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
gap: 25px;
margin-bottom: 50px;
}

.imageBox {
background: rgba(0,0,0,0.75);
padding: 15px;
border: 1px solid #00ff9d;
box-shadow: 0 0 20px #00ff9d33;
display: flex;
justify-content: center;
}

.imageBox img {
width: 100%;
max-height: 500px;
object-fit: contain;
display: block;
border: 2px solid #00ff9d;
box-shadow:
0 0 10px #00ff9d,
0 0 25px #00ff9d44;
}

/* TEXT BOX */

.messageBox {
background: rgba(0,0,0,0.75);
border: 1px solid #00ff9d;
padding: 30px;
line-height: 1.8;
font-size: 18px;
box-shadow: 0 0 20px #00ff9d33;
margin-bottom: 40px;
}

.messageBox h2 {
margin-top: 0;
font-size: 34px;
letter-spacing: 3px;
text-align: center;
margin-bottom: 25px;
}

/* BUTTON */

.backBtn {
display: block;
width: 280px;
margin: auto;
padding: 14px;
background: black;
border: 1px solid #00ff9d;
color: #00ff9d;
font-family: "Courier New", monospace;
font-size: 18px;
cursor: pointer;
transition: 0.2s;
}

.backBtn:hover {
background: #00ff9d;
color: black;
box-shadow: 0 0 20px #00ff9d;
}

/* FOOTER */

footer {
margin-top: 60px;
padding: 25px;
text-align: center;
border-top: 1px solid #00ff9d;
background: rgba(0,0,0,0.8);
color: #7fffd4;
font-size: 14px;
}

</style>
</head>

<body>

</div>

</body>

</html>
